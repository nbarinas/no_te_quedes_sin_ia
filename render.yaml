services:
  - type: web
    name: whatsapp-talleres-ia
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 10000
        # Render asigna su propio $PORT; este valor se sobrescribe.
